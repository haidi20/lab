<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f9ff">
  <title>Login WiFi — WiFi Access</title>
  <script src="/vendor/emotion-css.umd.min.js"></script>
  <script>
    (function() {
      const { css, keyframes, injectGlobal } = window.emotion;
      const cardEntrance = keyframes`
        from {
          opacity: 0;
          transform: translateY(34px) scale(.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      `;

      const pageFloat = keyframes`
        from {
          background-position: 0% 0%;
        }
        to {
          background-position: 100% 100%;
        }
      `;

      const iconPulse = keyframes`
        0%, 100% {
          box-shadow: 0 12px 24px rgba(14, 165, 233, .22);
          transform: translateY(0);
        }
        50% {
          box-shadow: 0 18px 34px rgba(14, 165, 233, .32);
          transform: translateY(-3px);
        }
      `;

      const focusGlow = keyframes`
        from {
          box-shadow: 0 0 0 0 rgba(14, 165, 233, 0);
        }
        to {
          box-shadow: 0 0 0 4px rgba(14, 165, 233, .14);
        }
      `;

      injectGlobal`
        * {
          box-sizing: border-box;
        }

        body,
        h1,
        p {
          margin: 0;
        }

        button,
        input {
          font: inherit;
        }

        @media (prefers-reduced-motion: reduce) {
          *,
          *::before,
          *::after {
            animation-duration: .01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: .01ms !important;
          }
        }
      `;

      const styles = {
        page: css`
          min-height: 100dvh;
          display: grid;
          place-items: center;
          padding: 24px;
          color: #0f172a;
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background:
            radial-gradient(circle at 12% 18%, rgba(14, 165, 233, .14) 0, transparent 28%),
            radial-gradient(circle at 88% 82%, rgba(56, 189, 248, .16) 0, transparent 30%),
            linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
          animation: ${pageFloat} 22s ease-in-out infinite alternate;
        `,
        card: css`
          width: min(420px, 100%);
          padding: 36px;
          background: #ffffff;
          border: 1px solid #e0f2fe;
          border-radius: 28px;
          box-shadow: 0 24px 70px rgba(14, 165, 233, .13);
          animation: ${cardEntrance} .52s cubic-bezier(.23, 1, .32, 1) both;
        `,
        brand: css`
          display: flex;
          align-items: center;
          gap: 14px;
          margin-bottom: 28px;
          animation: ${cardEntrance} .46s cubic-bezier(.23, 1, .32, 1) .08s both;
          animation-delay: .08s;
        `,
        brandIcon: css`
          width: 46px;
          height: 46px;
          display: grid;
          place-items: center;
          border-radius: 16px;
          color: #ffffff;
          background: linear-gradient(135deg, #0ea5e9, #0284c7);
          animation: ${iconPulse} 2.8s ease-in-out infinite;
        `,
        brandTitle: css`
          font-size: 22px;
          line-height: 1.25;
          font-weight: 800;
          letter-spacing: -.02em;
          animation: ${cardEntrance} .42s cubic-bezier(.23, 1, .32, 1) .14s both;
          animation-delay: .14s;
        `,
        brandSubtitle: css`
          margin-top: 4px;
          color: #64748b;
          font-size: 14px;
          line-height: 1.4;
          animation: ${cardEntrance} .42s cubic-bezier(.23, 1, .32, 1) .2s both;
          animation-delay: .2s;
        `,
        alert: css`
          margin-bottom: 20px;
          padding: 12px 14px;
          border: 1px solid #fecaca;
          border-radius: 14px;
          background: #fef2f2;
          color: #991b1b;
          font-size: 14px;
          line-height: 1.4;
          animation: ${cardEntrance} .38s cubic-bezier(.23, 1, .32, 1) both;
        `,
        field: css`
          margin-bottom: 20px;
          animation: ${cardEntrance} .44s cubic-bezier(.23, 1, .32, 1) .22s both;
          animation-delay: .22s;
        `,
        label: css`
          display: block;
          margin-bottom: 8px;
          color: #334155;
          font-size: 14px;
          font-weight: 700;
        `,
        input: css`
          width: 100%;
          min-height: 52px;
          padding: 0 16px;
          border: 1px solid #bae6fd;
          border-radius: 16px;
          background: #fbfeff;
          color: #0f172a;
          font-size: 16px;
          transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;

          &:focus {
            outline: 0;
            border-color: #0ea5e9;
            background: #ffffff;
            animation: ${focusGlow} .24s ease-out both;
          }

          &:focus-visible {
            outline: 3px solid rgba(14, 165, 233, .38);
            outline-offset: 2px;
          }
        `,
        passwordWrap: css`
          position: relative;
          display: grid;

          & .${input} {
            padding-right: 58px;
          }
        `,
        passwordToggle: css`
          position: absolute;
          top: 8px;
          right: 8px;
          width: 38px;
          height: 38px;
          display: grid;
          place-items: center;
          border: 0;
          border-radius: 12px;
          background: transparent;
          color: #64748b;
          cursor: pointer;
          transition: background-color .18s ease, color .18s ease;

          &:hover,
          &:focus-visible {
            color: #0284c7;
            background: #f0f9ff;
            outline: 0;
          }
        `,
        submit: css`
          width: 100%;
          min-height: 54px;
          margin-top: 6px;
          border: 0;
          border-radius: 18px;
          color: #ffffff;
          font-size: 16px;
          font-weight: 800;
          cursor: pointer;
          background: linear-gradient(135deg, #0ea5e9, #0284c7);
          box-shadow: 0 14px 28px rgba(14, 165, 233, .24);
          transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;

          &:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
            box-shadow: 0 18px 34px rgba(14, 165, 233, .28);
          }

          &:focus-visible {
            outline: 3px solid rgba(14, 165, 233, .38);
            outline-offset: 2px;
          }

          &:disabled {
            cursor: not-allowed;
            opacity: .72;
            transform: none;
          }
        `,
        support: css`
          margin: 22px 0 0;
          color: #64748b;
          font-size: 13px;
          line-height: 1.5;
          text-align: center;
          animation: ${cardEntrance} .44s cubic-bezier(.23, 1, .32, 1) .28s both;
          animation-delay: .28s;
        `,
      };

      injectGlobal`
        @media (max-width: 380px) {
          .${styles.card} {
            padding: 28px 22px;
            border-radius: 24px;
          }
        }
      `;

      document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll("[data-emotion]").forEach(function(element) {
          const styleName = element.getAttribute("data-emotion");
          element.className = styles[styleName] || "";
        });
      });
    })();
  </script>
</head>
<body data-emotion="page">
  <main data-emotion="card" aria-labelledby="page-title">
    <header data-emotion="brand">
      <div data-emotion="brandIcon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 15.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1 data-emotion="brandTitle" id="page-title">WiFi Access</h1>
        <p data-emotion="brandSubtitle">Masukkan username &amp; password dari transaksi Anda</p>
      </div>
    </header>

    $(if error)<div data-emotion="alert" role="alert" aria-live="assertive">$(error)</div>$(endif)

    <form id="login-form" method="post" action="$(link-login-only)">
      <div data-emotion="field">
        <label data-emotion="label" for="username">Username</label>
        <input data-emotion="input" id="username" name="username" type="text" inputmode="text" autocapitalize="none" autocomplete="username" spellcheck="false" required>
      </div>

      <div data-emotion="field">
        <label data-emotion="label" for="password">Password</label>
        <div data-emotion="passwordWrap">
          <input data-emotion="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <button data-emotion="passwordToggle" id="password-toggle" type="button" aria-controls="password" aria-label="Tampilkan password" aria-pressed="false" data-visible-label="Sembunyikan" data-hidden-label="Tampilkan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">
      <button data-emotion="submit" id="submit-button" type="submit" data-loading-label="Memproses...">Masuk</button>
    </form>

    <p data-emotion="support">Butuh bantuan? Hubungi kasir.</p>
  </main>

  <script>
    (function() {
      const form = document.getElementById('login-form');
      const password = document.getElementById('password');
      const toggle = document.getElementById('password-toggle');
      const submitButton = document.getElementById('submit-button');
      const visibleIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      const hiddenIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.29 3.19"/><path d="M6.61 6.61A17.32 17.32 0 0 0 2 12s3.5 7 10 7a10.74 10.74 0 0 0 5.39-1.39"/><path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/></svg>';

      toggle.addEventListener('click', function() {
        const isVisible = password.type === 'text';
        password.type = isVisible ? 'password' : 'text';
        toggle.innerHTML = isVisible ? visibleIcon : hiddenIcon;
        toggle.setAttribute('aria-pressed', String(!isVisible));
        toggle.setAttribute('aria-label', isVisible ? toggle.dataset.hiddenLabel + ' password' : toggle.dataset.visibleLabel + ' password');
      });

      form.addEventListener('submit', function() {
        submitButton.disabled = true;
        submitButton.textContent = submitButton.dataset.loadingLabel;
      });
    })();
  </script>
</body>
</html>
