[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inaproc-tkdn"
version = "1.0.0"
description = "Read-only INAPROC TKDN collector and API Gateway cache"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.110",
  "httpx>=0.27",
  "playwright>=1.40",
  "pydantic>=2.5",
  "pymysql>=1.1",
  "uvicorn>=0.29",
]

[tool.setuptools]
packages = ["modules.inaproc", "modules.inaproc.api"]
