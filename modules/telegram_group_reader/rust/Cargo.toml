[package]
name = "telegram_group_reader_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
futures = "0.3"
grammers-client = { version = "0.12.0" }
grammers-mtsender = "0.12.0"
grammers-session = { version = "0.12.0", default-features = false, features = ["sqlite-storage"] }
grammers-tl-types = "0.12.0"
mysql_async = "0.35"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
jiff = "0.2"

